<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Chữ Phúc dán ngược trên tấm giấy đỏ, hai bên treo đèn lồng, có cành hoa mai">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e5cf"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8302a"/>
      <stop offset="1" stop-color="#9c1a15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98f"/>
      <stop offset=".5" stop-color="#d1a849"/>
      <stop offset="1" stop-color="#b8913f"/>
    </linearGradient>
    <radialGradient id="lantern" cx="40%" cy="40%" r="65%">
      <stop offset="0" stop-color="#e5483d"/>
      <stop offset="1" stop-color="#a3201b"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="18" fill="url(#bg)"/>

  <!-- vầng sáng -->
  <circle cx="120" cy="122" r="92" fill="#f6dfa6" opacity=".35"/>

  <!-- cành mai -->
  <path d="M8 46 C 40 40, 62 30, 92 10" stroke="#6b4a32" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M40 40 C 46 28, 50 22, 58 16" stroke="#6b4a32" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <g fill="#f3a7a7">
    <circle cx="30" cy="40" r="6"/><circle cx="58" cy="16" r="5.5"/><circle cx="72" cy="24" r="6"/><circle cx="88" cy="12" r="4.5"/><circle cx="14" cy="45" r="4"/>
  </g>
  <g fill="#e0a43c"><circle cx="30" cy="40" r="1.8"/><circle cx="58" cy="16" r="1.6"/><circle cx="72" cy="24" r="1.8"/></g>

  <!-- dây treo -->
  <line x1="120" y1="0" x2="120" y2="40" stroke="#b8913f" stroke-width="2"/>

  <!-- tấm giấy đỏ hình thoi (斗方) -->
  <g transform="translate(120 128) rotate(45)">
    <rect x="-62" y="-62" width="124" height="124" rx="6" fill="url(#paper)"/>
    <rect x="-55" y="-55" width="110" height="110" rx="4" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="-50" y="-50" width="100" height="100" rx="3" fill="none" stroke="#e8c879" stroke-width=".8" stroke-dasharray="3 3"/>
  </g>
  <!-- chữ 福 dán ngược: "phúc đến" -->
  <text x="120" y="128" transform="rotate(180 120 128)" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','STSong','SimSun',serif" font-weight="700" font-size="82" fill="url(#gold)"
        stroke="#7a1410" stroke-width=".8">福</text>

  <!-- đèn lồng trái -->
  <g transform="translate(36 118)">
    <line x1="0" y1="-56" x2="0" y2="-28" stroke="#b8913f" stroke-width="1.5"/>
    <rect x="-8" y="-30" width="16" height="6" rx="2" fill="#d1a849"/>
    <ellipse cx="0" cy="0" rx="22" ry="25" fill="url(#lantern)"/>
    <path d="M-11 -23 Q -16 0 -11 23 M0 -25 V25 M11 -23 Q 16 0 11 23" stroke="#e8c879" stroke-width="1" fill="none" opacity=".7"/>
    <rect x="-8" y="23" width="16" height="6" rx="2" fill="#d1a849"/>
    <path d="M-4 29 V46 M0 29 V50 M4 29 V46" stroke="#c8302a" stroke-width="1.6"/>
  </g>
  <!-- đèn lồng phải -->
  <g transform="translate(204 128)">
    <line x1="0" y1="-66" x2="0" y2="-28" stroke="#b8913f" stroke-width="1.5"/>
    <rect x="-8" y="-30" width="16" height="6" rx="2" fill="#d1a849"/>
    <ellipse cx="0" cy="0" rx="22" ry="25" fill="url(#lantern)"/>
    <path d="M-11 -23 Q -16 0 -11 23 M0 -25 V25 M11 -23 Q 16 0 11 23" stroke="#e8c879" stroke-width="1" fill="none" opacity=".7"/>
    <rect x="-8" y="23" width="16" height="6" rx="2" fill="#d1a849"/>
    <path d="M-4 29 V46 M0 29 V50 M4 29 V46" stroke="#c8302a" stroke-width="1.6"/>
  </g>

  <!-- tua dưới tấm giấy -->
  <path d="M120 216 V234" stroke="#c8302a" stroke-width="2"/>
  <circle cx="120" cy="214" r="4" fill="#d1a849"/>

  <!-- lấp lánh -->
  <g fill="#d1a849">
    <path d="M190 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M52 200 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M196 206 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z"/>
  </g>
</svg>

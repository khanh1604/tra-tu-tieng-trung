<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tra Từ Tiếng Trung</title>
  <meta name="description" content="Tra cứu từ tiếng Trung giản thể: phiên âm pinyin, giọng đọc, âm Hán Việt và nghĩa tiếng Việt.">
  <meta name="theme-color" content="#8b1e1e">
  <link rel="stylesheet" href="css/tra-cuu.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">中 Tra Từ Tiếng Trung</a>
  </header>

  <main>
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Gõ chữ Hán, pinyin (vd: nihao) hoặc nghĩa (vd: cảm ơn)…" aria-label="Tìm từ">
    </div>

    <article class="card word" id="detail" hidden></article>

    <section>
      <h2 id="listTitle">Tất cả từ</h2>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Không tìm thấy từ nào.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/words.js"></script>
  <script src="js/tra-cuu.js"></script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tra Từ Tiếng Trung</title>
  <meta name="description" content="Tra cứu từ tiếng Trung giản thể: phiên âm pinyin, giọng đọc, âm Hán Việt và nghĩa tiếng Việt.">
  <meta name="theme-color" content="#a3201b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/tra-cuu.css?v=5">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="seal">学</span> Tra Từ Tiếng Trung</a>
  </header>

  <main>
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Gõ chữ Hán, pinyin (vd: nihao) hoặc nghĩa (vd: cảm ơn)…" aria-label="Tìm từ">
    </div>

    <article class="card word" id="detail" hidden></article>

    <section>
      <h2 id="listTitle">Tất cả từ</h2>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Không tìm thấy từ nào.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="js/words.js?v=5"></script>
  <script src="js/chars.js?v=5"></script>
  <script src="js/illus.js?v=5"></script>
  <script src="js/messages.js?v=5"></script>
  <script src="js/tra-cuu.js?v=5"></script>
</body>
</html>
